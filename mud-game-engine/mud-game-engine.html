<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻境传说 - MUD 文字冒险</title>
<link rel="stylesheet" href="assets/ui-colors.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="header">
  <div class="title">⚔ 幻境传说 ⚔</div>
  <div class="header-actions">
    <button class="header-btn" onclick="Game.save()">💾 存档</button>
    <button class="header-btn" onclick="Game.load()">📂 读档</button>
    <button class="header-btn" onclick="exec('help')">❓ 帮助</button>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">📜 角色</div>
      <div id="player-info"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">🗡 装备</div>
      <div id="equip-info"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">🗺 迷你地图</div>
      <div id="map-level-info" class="map-level-info"></div>
      <div class="minimap" id="minimap"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">📍 当前位置</div>
      <div id="location-info" style="font-size:0.85rem;color:var(--muted)"></div>
      <div class="direction-pad" aria-label="方向快捷指令">
        <button class="dir-btn dir-north" onclick="exec('north')" title="north 北">北</button>
        <button class="dir-btn dir-west" onclick="exec('west')" title="west 西">西</button>
        <button class="dir-btn dir-look" onclick="exec('look')" title="look 查看">看</button>
        <button class="dir-btn dir-east" onclick="exec('east')" title="east 东">东</button>
        <button class="dir-btn dir-south" onclick="exec('south')" title="south 南">南</button>
      </div>
      <div class="vertical-cmds">
        <button class="vertical-btn" onclick="exec('up')" title="up 上">上</button>
        <button class="vertical-btn" onclick="exec('down')" title="down 下">下</button>
      </div>
    </div>
  </div>

  <div class="battle-sidebar" id="battle-sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">📡 雷达</div>
      <canvas id="radar-canvas" width="220" height="220" style="width:100%;background:#051005;border:1px solid #2d5;border-radius:4px;display:block;"></canvas>
      <div id="radar-legend" style="font-size:11px;color:#888;margin-top:6px;"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">⚔ 敌人</div>
      <div id="enemy-list" style="font-size:12px;"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">⏱ 时间轴</div>
      <div id="timeline-content" style="font-size:11px;max-height:200px;overflow-y:auto;"></div>
    </div>
  </div>

  <div class="game-area">
    <div class="output" id="output"></div>
    <div class="battle-bar" id="battle-bar">
      <div class="battle-info">
        <span>⚔ 战斗中: <span class="battle-enemy" id="battle-enemy-name"></span></span>
        <span id="battle-round" style="color:var(--muted);font-size:0.8rem"></span>
      </div>
      <div class="battle-actions">
        <button class="battle-btn attack" onclick="Battle.action('attack')">⚔ 普攻</button>
        <button class="battle-btn skill" onclick="Battle.toggleSkillMenu()">✨ 技能</button>
        <button class="battle-btn potion" onclick="Battle.togglePotionMenu()">🧪 药水</button>
        <button class="battle-btn flee" onclick="Battle.action('flee')">🏃 逃跑</button>
      </div>
      <div class="battle-menu" id="battle-skill-menu"></div>
      <div class="battle-menu" id="battle-potion-menu"></div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <span class="input-prompt">&gt;</span>
        <input type="text" class="input-field" id="input" placeholder="输入指令... (输入 help 查看帮助)" autocomplete="off">
      </div>
      <div class="quick-cmds">
        <button class="quick-cmd" onclick="exec('look')">look 查看</button>
        <button class="quick-cmd" onclick="exec('bag')">bag 背包</button>
        <button class="quick-cmd" onclick="exec('pick')">pick 拾取</button>
        <button class="quick-cmd" onclick="exec('status')">status 状态</button>
        <button class="quick-cmd" onclick="exec('skills')">skills 技能</button>
      </div>
    </div>
  </div>

  <aside class="query-panel" id="query-panel" aria-label="查询窗口">
    <div class="query-header">
      <span id="query-title">查询窗口</span>
      <button class="query-clear" onclick="Msg.clearQuery()" title="清空查询窗口">清空</button>
    </div>
    <div class="query-output" id="query-output">
      <div class="msg system">查询类指令的信息会显示在这里。</div>
    </div>
  </aside>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/messages.js"></script>
<script src="assets/js/data/items.js"></script>
<script src="assets/js/data/skills.js"></script>
<script src="assets/js/data/enemies.js"></script>
<script src="assets/js/data/map.js"></script>
<script src="assets/js/systems/map-system.js"></script>
<script src="assets/js/data/npcs.js"></script>
<script src="assets/js/systems/player.js"></script>
<script src="assets/js/systems/battle.js"></script>
<script src="assets/js/systems/battle-ui.js"></script>
<script src="assets/js/systems/command-system.js"></script>
<script src="assets/js/systems/game.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
