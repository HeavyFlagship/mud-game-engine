<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>织女-7前哨 - 科幻战术MUD</title>
<link rel="stylesheet" href="assets/ui-colors.css">
<link rel="stylesheet" href="assets/ui-fonts.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
 
<div class="header">
  <div class="title">🚀 织女-7前哨 🚀</div>
  <div class="header-actions">
    <button class="header-btn" onclick="Game.save()">💾 存档</button>
    <button class="header-btn" onclick="Game.load()">📂 读档</button>
    <button class="header-btn" onclick="exec('help')">❓ 帮助</button>
  </div>
</div>
 
<div class="main grid-layout">
  <!-- 列1：区域地图（行1） + 角色状态（行2-3） -->
  <section class="panel panel-region-map">
    <div class="sidebar-title">区域地图</div>
    <div id="map-level-info" class="map-level-info">当前高度：地表</div>
    <div class="region-map-wrap">
      <canvas id="region-map-canvas" width="440" height="440"></canvas>
    </div>
    <div id="minimap-legend" class="minimap-legend">@ 当前位置 | <span style="color:#00ffcc;">青色</span> 已探索 | <span style="color:#888;">暗色</span> 未探索 | 💀 Boss | 🏠 安全区 | ⚠ 危害 | ⛏ 资源</div>
  </section>

  <!-- 列2：单位列表（行1-3） -->
  <section class="panel panel-unit-list">
    <div class="sidebar-title">单位列表</div>
    <div class="unit-section" id="unit-list-section">
      <div id="unit-list" class="unit-list"></div>
    </div>
    <div class="sidebar-title" style="margin-top:0.5rem;">敌人列表</div>
    <div class="enemy-section" id="enemy-list-section">
      <div id="enemy-list" class="enemy-list"><div style="color:var(--muted);font-size:var(--font-enemy-header);margin-bottom:6px;">存活 0/0</div></div>
    </div>
  </section>

  <!-- 列3-4：场景地图（横跨3、4列，行1-2） -->
  <section class="panel panel-scene-map">
    <div class="sidebar-title">场景地图</div>
    <div class="radar-wrap">
      <button class="radar-dir-btn radar-dir-top" title="向北移动" onclick="BattleUI.quickDirMove('n')">▲</button>
      <button class="radar-dir-btn radar-dir-bottom" title="向南移动" onclick="BattleUI.quickDirMove('s')">▼</button>
      <button class="radar-dir-btn radar-dir-left" title="向西移动" onclick="BattleUI.quickDirMove('w')">◀</button>
      <button class="radar-dir-btn radar-dir-right" title="向东移动" onclick="BattleUI.quickDirMove('e')">▶</button>
      <canvas id="radar-canvas" width="200" height="200" style="width: 100%; background: rgb(5, 16, 5); border: 1px solid rgb(34, 221, 85); border-radius: 4px; display: block; cursor: crosshair;"></canvas>
    </div>
    <div id="radar-legend" style="font-size:var(--font-radar-legend);color:#888;margin-top:4px;"><span style="color:#0ff;">●</span> 玩家 &nbsp; <span style="color:#8cf;">●</span> NPC &nbsp; <span style="color:#f44;">●</span> 威胁 &nbsp; <span style="color:#fd0;">●</span> 未警觉</div>
    <div class="scene-location" id="location-info"></div>
  </section>

  <!-- 列3行3：装备 -->
  <section class="panel panel-equip">
    <div class="sidebar-title">装备</div>
    <div id="equip-info"></div>
  </section>

  <!-- 列4行3：时间轴 -->
  <section class="panel panel-timeline" id="timeline-panel">
    <div class="timeline-header">
      <span class="sidebar-title">时间轴</span>
      <span id="battle-time" class="battle-time">00:00:00</span>
    </div>
    <div id="ready-list" class="ready-list"></div>
    <div id="timeline-content" class="timeline-content"></div>
  </section>

  <!-- 列5：命令行区（行1-3） -->
  <section class="panel panel-console">
    <div class="game-area game-area--grid">
      <div class="output" id="output"></div>
      <div class="battle-bar" id="battle-bar">
        <div class="battle-info">
          <span>⚔ 战斗中: <span class="battle-enemy" id="battle-enemy-name"></span></span>
          <span id="battle-round" style="color:var(--muted);font-size:var(--font-hint)"></span>
        </div>
        <div class="battle-actions">
          <button class="battle-btn attack" onclick="Battle.action('attack')">⚔ 普攻</button>
          <button class="battle-btn skill" onclick="Battle.toggleSkillMenu()">✨ 技能</button>
          <button class="battle-btn potion" onclick="Battle.togglePotionMenu()">🧪 药水</button>
          <button class="battle-btn flee" onclick="Battle.action('flee')">🏃 逃跑</button>
        </div>
        <div class="battle-menu" id="battle-skill-menu"></div>
        <div class="battle-menu" id="battle-potion-menu"></div>
      </div>
      <div class="input-area">
        <div class="input-row">
          <span class="input-prompt">&gt;</span>
          <input type="text" class="input-field" id="input" placeholder="输入指令... (输入 help 查看帮助)" autocomplete="off">
        </div>
        <div class="quick-cmds">
          <button class="quick-cmd" onclick="exec('look')">look 查看</button>
          <button class="quick-cmd" onclick="exec('bag')">bag 背包</button>
          <button class="quick-cmd" onclick="exec('map')">map 地图</button>
          <button class="quick-cmd" onclick="exec('status')">status 状态</button>
          <button class="quick-cmd" onclick="exec('skills')">skills 技能</button>
          <button class="quick-cmd" onclick="exec('help')">help 帮助</button>
          <button class="quick-cmd" onclick="exec('save')">save 存档</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 列6：查询窗口（行1-3） -->
  <aside class="panel panel-query query-panel" id="query-panel" aria-label="查询窗口">
    <div class="query-header">
      <span id="query-title">查询窗口</span>
      <button class="query-clear" onclick="Msg.clearQuery()" title="清空查询窗口">清空</button>
    </div>
    <div class="query-output" id="query-output"></div>
  </aside>

  <!-- 角色信息：放在区域地图列，行2-3 span（保持原 sidebar 内容不变，只搬运位置） -->
  <section class="panel panel-player">
    <div class="sidebar-title">角色状态信息</div>
    <div id="player-info"></div>
    <div id="player-status-section" style="display: none; margin-top: 0.5rem;">
      <div class="sidebar-title" style="margin-top:0.5rem;">状态效果</div>
      <div id="player-status-effects"></div>
    </div>
  </section>
</div>

<div class="unit-context-menu" id="unit-context-menu" role="menu"></div>

<script src="assets/js/systems/timeline.js"></script>
<script src="assets/js/systems/battle-ui.js"></script>
